# OpenNext for Cloudflare Workers
# https://opennext.js.org/cloudflare/get-started

name = "wow3d-all-print"
main = "scripts/worker-entry.mjs"
compatibility_date = "2024-12-30"

# 커스텀 도메인은 Cloudflare 대시보드에서 연결 (Workers & Pages > wow3d-all-print > 설정 > 도메인 및 경로 > Custom Domain)
# wrangler에 routes를 두면 CI 배포 시 zone/권한 오류로 실패할 수 있으므로 대시보드에서만 관리
# [[routes]]
# pattern = "wow3dp.co.kr"
# custom_domain = true
# [[routes]]
# pattern = "www.wow3dp.co.kr"
# custom_domain = true
# /memberships API 호출 없이 배포하려면 account_id 명시 (CLOUDFLARE_API_TOKEN 사용 시)
account_id = "85c8e953bdefb825af5374f0d66ca5dc"
# nodejs_compat_populate_process_env: 대시보드 Variables/Secrets가 process.env에 채워지도록 함
compatibility_flags = [
  "nodejs_compat",
  "nodejs_compat_populate_process_env",
  "global_fetch_strictly_public",
]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "wow3d-all-print"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "wow3d-production"
database_id = "8fc9fb41-4fae-4e6f-af47-6195d825ab8d"

# R2 Storage (3D 파일 저장)
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "wow3d-files"

[vars]
ENVIRONMENT = "production"

# 매일 00:00 KST(UTC 15:00) — 배송중→배송완료(5일), 배송완료→완료됨(2일) 자동 전환
[triggers]
crons = ["0 15 * * *"]
