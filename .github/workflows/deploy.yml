# Cloudflare Workers 배포 (수동 실행만 - Actions에서 "Run workflow"로 배포)
# 푸시 시 자동 배포를 원하면 아래 push 블록 주석 해제
name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:  # 수동: GitHub Actions > Deploy to Cloudflare Workers > Run workflow
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEXT_PUBLIC_APP_URL: https://www.wow3dp.co.kr
          NEXT_PUBLIC_NAVER_TALKTALK_ID: wowi7tu
          NEXT_PUBLIC_NAVER_TALKTALK_CHAT_URL: https://talk.naver.com/profile/wowi7tu
          NEXT_PUBLIC_NAVER_TALKTALK_BANNER_ID: ${{ secrets.NEXT_PUBLIC_NAVER_TALKTALK_BANNER_ID }}
          NEXT_PUBLIC_KAKAO_CHANNEL_SEARCH_ID: ${{ secrets.NEXT_PUBLIC_KAKAO_CHANNEL_SEARCH_ID }}
        run: npm run deploy
